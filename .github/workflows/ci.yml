name: AutoMD CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  desktop-binary:
    name: Desktop binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact_path: src-tauri/target/release/automd
          - name: windows-x86_64
            os: windows-latest
            artifact_path: src-tauri/target/release/automd.exe
          - name: macos-arm64
            os: macos-14
            artifact_path: src-tauri/target/release/automd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop binary without installer bundle
        run: npm run tauri -- build --no-bundle --ci

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: automd-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  macos-app:
    name: macOS arm64 app bundle
    runs-on: macos-14
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS app bundle
        run: npm run tauri:build:app

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: AutoMD-macos-arm64-app
          path: src-tauri/target/release/bundle/macos/AutoMD.app
          if-no-files-found: error
